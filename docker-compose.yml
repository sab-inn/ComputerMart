services:
  mariadb:
    image: mariadb:11
    container_name: computemart-php-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: computemart_php
      MARIADB_USER: computemart
      MARIADB_PASSWORD: computemart_php_pw
      MARIADB_ROOT_PASSWORD: root_dev_pw
    ports:
      - "3307:3306"
    volumes:
      - computemart_php_data:/var/lib/mysql

volumes:
  computemart_php_data:
